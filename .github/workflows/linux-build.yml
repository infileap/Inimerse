name: Linux build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Protocol regression
        run: node tools/regression.js
      - name: Build and run POSIX checks
        run: make -j2 check
      - name: CMake build, tests, and package
        run: |
          cmake -S . -B build -DINIMERSE_BUILD_ENGINE=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          cmake --build build --target package
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: inimerse-linux-packages
          path: |
            build/inimerse-0.3.0-Linux-*.tar.gz
            build/inimerse-0.3.0-Linux-*.zip
            build/inimerse-0.3.0-Linux-*.deb
      - name: Clean generated binary
        if: always()
        run: make clean

  wasm-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc
      - name: Build WASI probe
        run: make wasm
      - name: Verify WebAssembly artifact
        run: file tools/wasm_probe.wasm | grep -qi 'WebAssembly'
