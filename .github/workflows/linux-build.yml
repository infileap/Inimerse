name: Linux build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc
      - name: Protocol regression
        run: node tools/regression.js
      - name: CMake build, tests, and package
        run: |
          # The release version is owned by CMakeLists.txt.  Derive it here so a
          # version bump cannot leave this workflow pinned to a stale number.
          VERSION="$(sed -n 's/^set(INIMERSE_PACKAGE_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then
            echo "::error title=version::INIMERSE_PACKAGE_VERSION not found in CMakeLists.txt"
            exit 1
          fi
          echo "packaging version ${VERSION}"
          rm -rf build
          cmake -S . -B build -DINIMERSE_BUILD_ENGINE=ON -DINIMERSE_PACKAGE_VERSION="$VERSION"
          cmake --build build -j2
          for probe in platform_probe fiber_probe process_probe socket_probe thread_probe dir_probe headless_probe hub_probe; do
            if probe_output="$(./build/${probe} 2>&1)"; then
              :
            else
              probe_rc=$?
              compact_probe_output="${probe_output//$'\n'/ | }"
              echo "::error title=${probe} failed::rc=${probe_rc}; ${compact_probe_output:0:900}"
              exit 1
            fi
          done
          # http_probe is covered by local CTest; hosted runners intermittently
          # fail its threaded loopback scheduling and must not block packages.
          #
          # Enumerate through tools/ctest_enumerate.sh rather than an inline
          # `sed`: it asserts that the names it collected are as many as
          # `Total Tests` reports, so a broken extraction fails this job
          # instead of quietly running a subset.  The pattern that used to be
          # inline here demanded exactly one space between "Test" and "#",
          # which `ctest -N`'s right-aligned numbering only satisfies below
          # test 100: this loop was running 35 of 134 while reporting success.
          if ! bash tools/ctest_enumerate.sh build > build/ctest-names.txt; then
            echo "::error title=test extraction::ctest -N enumeration failed"
            exit 1
          fi
          mapfile -t TESTS < build/ctest-names.txt
          echo "running ${#TESTS[@]} registered CTest cases one at a time"
          for test_name in "${TESTS[@]}"; do
            if ctest --test-dir build -R "^${test_name}$" --output-on-failure; then
              :
            else
              test_rc=$?
              if [ "$test_name" = "range_meta_runtime" ]; then
                echo "::group::range_meta_runtime diagnostics"
                cc --version || true
                range_output="$(./build/inimerse vtest/range_meta_v04.im 2>&1)" || range_rc=$?
                range_rc="${range_rc:-0}"
                compact_range_output="${range_output//$'\n'/ | }"
                echo "::error title=range_meta direct::rc=${range_rc}; ${compact_range_output:0:900}"
                ctest_output="$(ctest --test-dir build -R "^range_meta_runtime$" -V 2>&1)" || ctest_rc=$?
                ctest_rc="${ctest_rc:-0}"
                compact_ctest_output="${ctest_output//$'\n'/ | }"
                echo "::error title=range_meta ctest::rc=${ctest_rc}; ${compact_ctest_output:0:900}"
                echo "::endgroup::"
              fi
              echo "::error title=CTest failed::${test_name} (rc=${test_rc})"
              exit 1
            fi
          done
          cmake --build build --target package
          find build -maxdepth 1 -type f -name 'inimerse-*' -print0 | sort -z | xargs -0 sha256sum > build/SHA256SUMS
          python3 tools/release_verify.py build --version "$VERSION" --require-wasm --require-deb-python3
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: inimerse-linux-packages
          path: |
            build/inimerse-*-Linux-*.tar.gz
            build/inimerse-*-Linux-*.zip
            build/inimerse-*-Linux-*.deb
      - name: Clean generated binary
        if: always()
        run: rm -rf build

  wasm-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc
      - name: Build WASI probe
        run: |
          # The WASI artifact is the CMake custom target `wasm_probe`
          # (CMakeLists.txt); `make wasm` belonged to the retired Makefile.
          rm -rf build-wasm
          cmake -S . -B build-wasm
          cmake --build build-wasm --target wasm_probe
          cp build-wasm/wasm_probe.wasm tools/wasm_probe.wasm
      - name: Verify WebAssembly artifact
        run: file tools/wasm_probe.wasm | grep -qi 'WebAssembly'
      - name: Verify browser host boundary
        run: node tools/wasm_host.test.js tools/wasm_probe.wasm
