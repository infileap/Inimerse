name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Protocol regression
        run: node tools/regression.js
      - name: Build Windows core
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./build.ps1
      - name: CMake tests
        shell: pwsh
        run: |
          $report = Join-Path $PWD "build-windows-gcc\ctest-results.xml"
          ctest --test-dir build-windows-gcc --output-on-failure --output-junit $report
          $ctestExit = $LASTEXITCODE
          if ($ctestExit -ne 0 -and (Test-Path $report)) {
            [xml]$results = Get-Content -LiteralPath $report -Raw
            foreach ($test in $results.SelectNodes("//testcase[failure or error]")) {
              $details = ($test.InnerText -replace "[\r\n]+", " | ").Trim()
              if ($details.Length -gt 900) { $details = $details.Substring(0, 900) }
              Write-Host "::error title=CTest failed::$($test.name): $details"
            }
          }
          exit $ctestExit
