name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Protocol regression
        run: node tools/regression.js
      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Build Windows core
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./build.ps1
      # Before the suite, not after it.  Two reasons, and the second is the one
      # that made this step exist:
      #
      #   1. `DISABLED TRUE` removes a test from the `out of N` denominator, so
      #      this build's own summary -- `98% tests passed, 3 tests failed out of
      #      138` for 147 registered cases -- cannot report the nine hub
      #      regressions that never ran.  Reading the registry is the only way to
      #      see them, and reading it before the run keeps a missing declaration
      #      apart from a compiler failure: one is a fact about CMakeLists.txt,
      #      the other needs the log.
      #   2. The declarations live in tools/known-skips-windows.txt, which the
      #      Linux job never consults.  `--check-disabled` refuses an undeclared
      #      disabled test (exit 2) and also refuses a declaration that names no
      #      registered test, so this list cannot rot into a licence nobody reads.
      #   3. The allowlist mode uses its own numbers -- 10 unusable content, 11
      #      names no registered test, 12 names one only after a misread, 20 the
      #      list or the registry could not be read at all -- because the
      #      per-test numbers already mean other things here (3 is "the name is
      #      wrong", which asks the opposite repair; 1 is "the test failed").
      #      One number, one debt; every line also carries a `result=<token>` so
      #      a log search does not have to trust a number.
      #
      # `shell: bash` is Git Bash on this runner, which has bash 5 and inherits
      # the Windows PATH -- so `ctest` resolves and `$PWD` is a POSIX path the
      # allowlist check can open.  Do not move this to `shell: msys2 {0}`: that
      # PATH is the UCRT64 tree and would not find CMake's ctest.
      - name: Skip exemptions (Windows)
        shell: bash
        run: |
          export INIMERSE_KNOWN_SKIPS="$PWD/tools/known-skips-windows.txt"
          echo "::group::exemption list"
          bash tools/ctest_skip_guard.sh --check-allowlist build-windows-gcc
          echo "::endgroup::"
          echo "::group::disabled tests"
          bash tools/ctest_skip_guard.sh --check-disabled build-windows-gcc
          echo "::endgroup::"
      - name: CMake tests
        shell: pwsh
        run: |
          $report = Join-Path $PWD "build-windows-gcc\ctest-results.xml"
          ctest --test-dir build-windows-gcc --output-on-failure --output-junit $report
          $ctestExit = $LASTEXITCODE
          if ($ctestExit -ne 0 -and (Test-Path $report)) {
            [xml]$results = Get-Content -LiteralPath $report -Raw
            foreach ($test in $results.SelectNodes("//testcase[failure or error]")) {
              $details = ($test.InnerText -replace "[\r\n]+", " | ").Trim()
              if ($details.Length -gt 900) { $details = $details.Substring($details.Length - 900) }
              Write-Host "::error title=CTest failed::$($test.name): $details"
            }
          }
          exit $ctestExit
      # The suite above runs as one `ctest` invocation, so a test that stops
      # running leaves no step behind: nine disabled tests drop out of the
      # denominator and two skipped tests stay in it counted as passing, which
      # is how this job can report `98% tests passed` about a suite that is
      # short eleven tests.  This step reads the JUnit report the run wrote --
      # present even when ctest exited non-zero -- and refuses any test that
      # did not run without being declared.  It carries no `hashFiles` guard:
      # a step the runner skips leaves no line in any summary, so a missing
      # report would read exactly like a clean one.  The guard itself answers
      # 20 when the report cannot be read, which keeps "nothing was checked"
      # visible in the log and in the job's exit code.
      - name: Tests that did not run (Windows)
        if: always()
        shell: bash
        run: |
          export INIMERSE_KNOWN_SKIPS="$PWD/tools/known-skips-windows.txt"
          bash tools/ctest_skip_guard.sh --check-junit "build-windows-gcc/ctest-results.xml"
