name: Release Infiverse

on:
  push:
    tags: ['v*']

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: node tools/regression.js
      - name: Build engine and desktop app
        shell: pwsh
        run: ./build.ps1
      - name: Build installer
        shell: pwsh
        run: ./build_installer.ps1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: D:/Infiverse_release/InfiverseSetup.exe
