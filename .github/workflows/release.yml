name: Release Inimerse 0.4.0

on:
  push:
    tags: ['v0.4.0']

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install WASI toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld wasi-libc
      - name: Build, test, and package
        run: |
          node tools/regression.js
          VERSION="0.4.0"
          cmake -S . -B build -DINIMERSE_BUILD_ENGINE=ON -DINIMERSE_PACKAGE_VERSION="$VERSION"
          cmake --build build -j2
          mapfile -t TESTS < <(ctest --test-dir build -N | sed -n 's/^[[:space:]]*Test #[0-9][0-9]*:[[:space:]]*//p')
          for test_name in "${TESTS[@]}"; do
            if ! ctest --test-dir build -R "^${test_name}$" --output-on-failure; then
              echo "::error title=CTest failed::${test_name}"
              if [[ "$test_name" == "range_meta_runtime" ]]; then
                echo "::group::range_meta_runtime diagnostics"
                cc --version | head -1 || true
                ./build/inimerse vtest/range_meta_v04.im || true
                ctest --test-dir build -R "^${test_name}$" -V || true
                echo "::endgroup::"
              fi
              exit 1
            fi
          done
          cmake --build build --target package
          find build -maxdepth 1 -type f -name 'inimerse-*' -print0 | sort -z | xargs -0 sha256sum > build/SHA256SUMS
          python3 tools/release_verify.py build --version "$VERSION" --require-wasm --require-deb-python3
          {
            cat docs/RELEASE_0.4.0.md
            printf '\n## SHA-256\n\n```text\n'
            cat build/SHA256SUMS
            printf '```\n'
          } > build/RELEASE_NOTES.md
      - name: Publish Linux packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: build/RELEASE_NOTES.md
          files: |
            build/inimerse-*.tar.gz
            build/inimerse-*.zip
            build/inimerse-*.deb
            build/SHA256SUMS
