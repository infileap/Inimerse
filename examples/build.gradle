// Gradle integration for the generated Inimerse JNI bridge (roadmap §3.2).
// Generated by: python3 tools/bindgen.py interface.def --language java --out InimerseNative.java
//
// The bridge expects libinimerse_native (the shared library implementing the
// native methods) on java.library.path; error conversion (InimerseException)
// is tested in tools/bindgen.test.py.

plugins {
    id 'java'
}

group = 'com.inimerse'
version = '0.5.0'

repositories { mavenCentral() }

sourceSets.main.java.srcDirs += 'build/generated/inimerse'

task generateInimerseBindings(type: Exec) {
    commandLine 'python3', "${rootDir}/tools/bindgen.py",
                "${rootDir}/examples/interface.def",
                '--language', 'java',
                '--out', "${buildDir}/generated/inimerse/InimerseNative.java"
    outputs.file "${buildDir}/generated/inimerse/InimerseNative.java"
}

compileJava.dependsOn generateInimerseBindings

jar {
    manifest { attributes 'Implementation-Title': 'inimerse-native', 'Implementation-Version': project.version }
}
